    // --- AUTOMATION TOAST ---
    function triggerToast(title, desc, status = 'success') {
      const toast = document.getElementById('automationToast');
      const toastInner = document.getElementById('toastInner');
      document.getElementById('toastTitle').innerText = title;
      document.getElementById('toastDesc').innerText = desc;
      
      toastInner.className = `p-4 rounded-2xl shadow-2xl border backdrop-blur-md flex items-start gap-3.5 ${
        status === 'warning' ? 'bg-amber-950/95 border-amber-600/50 text-amber-100' : 'bg-emerald-950/95 border-emerald-600/50 text-emerald-100'
      }`;

      // Add to state automations
      state.automations.unshift({
        id: 'auto-' + Date.now(),
        timestamp: 'Just now',
        type: 'schedule_reorganized',
        title,
        description: desc,
        status
      });

      // Add notification
      state.notifications.unshift({
        id: 'notif-' + Date.now(),
        title,
        message: desc,
        type: 'automation',
        timestamp: 'Just now',
        read: false
      });

      toast.classList.remove('hidden');
      setTimeout(() => hideToast(), 5000);
      saveState();
    }

    function hideToast() {
      document.getElementById('automationToast').classList.add('hidden');
    }

    // 5. ATTENDANCE ADVISOR
    function renderAttendance() {
      const totalAttended = state.attendance.reduce((acc, a) => acc + a.attendedClasses, 0);
      const totalClasses = state.attendance.reduce((acc, a) => acc + a.totalClasses, 0);
      const overallAtt = totalClasses ? ((totalAttended/totalClasses)*100).toFixed(1) : 100;
      const target = state.profile.defaultAttendanceRequirement || 75;

      return `
        <div class="space-y-6">
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-xl font-bold text-slate-800">Attendance Calculator & Bunk Advisor</h2>
              <p class="text-xs text-slate-500 mt-0.5">Subject-wise attendance, safe bunk quotas, and exam eligibility tracking</p>
            </div>
            <button onclick="openQuickModal('attendance')" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold shadow-md flex items-center gap-1.5">
              <i data-lucide="plus" class="w-4 h-4"></i>
              <span>Log Class</span>
            </button>
          </div>

          <div class="p-6 rounded-3xl bg-white border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
              <div class="w-14 h-14 rounded-2xl ${overallAtt>=target?'bg-emerald-100 text-emerald-700':'bg-rose-100 text-rose-700'} flex items-center justify-center text-lg font-black">
                ${overallAtt}%
              </div>
              <div>
                <h4 class="text-sm font-bold text-slate-800">Overall Attendance: ${overallAtt}%</h4>
                <p class="text-xs text-slate-500">Enrolled in ${state.attendance.length} courses • Policy minimum ${target}%</p>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs">
              <span class="text-slate-500">Target Threshold:</span>
              <span class="font-bold text-indigo-700">${target}%</span>
            </div>
          </div>

          <!-- Cards Grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
            ${state.attendance.map(a => {
              const pct = ((a.attendedClasses/a.totalClasses)*100).toFixed(1);
              const isSafe = pct >= a.targetPercentage;
              let advice = '';
              if (isSafe) {
                const canBunk = Math.max(0, Math.floor((a.attendedClasses - (a.targetPercentage/100)*a.totalClasses)/(a.targetPercentage/100)));
                advice = canBunk > 0 ? `Safe zone: You can safely bunk the next <strong>${canBunk} classes</strong>.` : `On the edge: Do not miss the next class.`;
              } else {
                const mustAttend = Math.ceil(((a.targetPercentage/100)*a.totalClasses - a.attendedClasses)/(1 - (a.targetPercentage/100)));
                advice = `Must attend next <strong>${mustAttend} consecutive classes</strong> to reach ${a.targetPercentage}%.`;
              }

              return `
                <div class="p-5 rounded-2xl bg-white border ${!isSafe ? 'border-rose-300 bg-rose-50/10' : 'border-slate-200'} shadow-xs flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-start">
                      <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${a.color}"></span>
                        <h4 class="text-sm font-bold text-slate-800">${a.subjectName}</h4>
                      </div>
                      <span class="text-xs font-semibold text-slate-400">${a.subjectCode}</span>
                    </div>

                    <div class="mt-4 flex items-baseline justify-between">
                      <span class="text-3xl font-black ${isSafe ? 'text-emerald-600' : 'text-rose-600'}">${pct}%</span>
                      <span class="text-xs font-bold text-slate-700 bg-slate-100 px-2.5 py-1 rounded-full">${a.attendedClasses}/${a.totalClasses} Classes</span>
                    </div>

                    <div class="mt-3 w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                      <div class="${isSafe ? 'bg-emerald-500' : 'bg-rose-500'} h-full rounded-full" style="width: ${pct}%"></div>
                    </div>

                    <div class="mt-4 p-3 rounded-xl text-xs ${isSafe ? 'bg-emerald-50 text-emerald-900' : 'bg-rose-100 text-rose-900'}">
                      ${advice}
                    </div>
                  </div>

                  <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between gap-2">
                    <button onclick="logAttendanceDelta('${a.id}', 1, 1)" class="flex-1 py-1.5 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold text-xs">+ Present</button>
                    <button onclick="logAttendanceDelta('${a.id}', 0, 1)" class="flex-1 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs">+ Absent</button>
                    <button onclick="logAttendanceDelta('${a.id}', -1, -1)" class="p-1.5 rounded-xl text-slate-400 hover:text-slate-600" title="Undo"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

                          style = 'bg-indigo-50 border-indigo-600 text-indigo-900 font-bold';
                        }

                        return `
                          <div onclick="if(!quizSubmitted){quizAnswers[${idx}]=${optIdx}; renderCurrentTab();}" class="p-3 rounded-xl border text-xs cursor-pointer ${style}">
                            ${opt}
                          </div>

                      }).join('')}

                    ${quizSubmitted ? `
                      <p class="text-xs text-slate-500 mt-1 bg-slate-50 p-2.5 rounded-xl border"><strong>Explanation:</strong> ${q.explanation}</p>

            <input type="time" id="qSessionTime" value="14:00" class="w-full bg-slate-50 border rounded-xl px-3 py-2">
            <button onclick="submitQuickSession()" class="w-full py-2.5 rounded-xl bg-cyan-600 text-white font-bold">Schedule Block</button>
          </div>
        `;
      } else if (type === 'attendance') {
        content.innerHTML = `
          <h3 class="text-base font-bold text-slate-800">Log Class Attendance</h3>
          <div class="mt-4 space-y-3 text-xs">
            <select id="qAttCourse" class="w-full bg-slate-50 border rounded-xl px-3 py-2">
              ${state.attendance.map(a => `<option value="${a.id}">${a.subjectCode}: ${a.subjectName}</option>`).join('')}
            </select>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="submitQuickAttendance(true)" class="py-2.5 rounded-xl bg-emerald-500 text-white font-bold">✓ Present</button>
              <button onclick="submitQuickAttendance(false)" class="py-2.5 rounded-xl bg-rose-500 text-white font-bold">✗ Absent</button>
            </div>
          </div>
        `;
      }
      modal.classList.remove('hidden');
    }

    function closeQuickModal() {
      document.getElementById('quickModal').classList.add('hidden');
    }

    function submitQuickTask() {
      const title = document.getElementById('qTaskTitle').value;
      if (!title) return;
      const [cName, cColor] = document.getElementById('qTaskCourse').value.split('|');
      const date = document.getElementById('qTaskDate').value;
      state.tasks.unshift({
        id: 'task-' + Date.now(),
        title,
        courseName: cName,
        courseColor: cColor,
        priority: 'high',
        dueDate: date,
        status: 'todo',
        source: 'manual'
      });
      triggerToast('Task Created', `"${title}" was added to Task Manager.`);
      closeQuickModal();
      saveState();
    }

    function submitQuickSession() {
      const title = document.getElementById('qSessionTitle').value;
      if (!title) return;
      const [cName, cColor] = document.getElementById('qSessionCourse').value.split('|');
      const time = document.getElementById('qSessionTime').value;
      state.sessions.unshift({
        id: 'session-' + Date.now(),
        title,
        subjectName: cName,
        subjectColor: cColor,
        date: '2026-10-15',
        startTime: time,
        endTime: '15:15',
        durationMinutes: 75,
        isCompleted: false,
        difficulty: 'medium',
        focusTopic: 'Problem sets'
      });
      triggerToast('Session Scheduled', `Scheduled study block for ${cName}.`);
      closeQuickModal();
      saveState();
    }

    function submitQuickAttendance(present) {
      const attId = document.getElementById('qAttCourse').value;
      logAttendanceDelta(attId, present ? 1 : 0, 1);
      closeQuickModal();
    }

    function toggleQuickMenu() {
      document.getElementById('quickMenu').classList.toggle('hidden');
    }

    function toggleNotifMenu() {
      document.getElementById('notifMenu').classList.toggle('hidden');
    }

    function renderNotificationsList() {
      const list = document.getElementById('notifList');
      const badge = document.getElementById('notifBadge');
      const unread = state.notifications.filter(n => !n.read).length;
      badge.innerText = unread;
      badge.style.display = unread ? 'flex' : 'none';

      list.innerHTML = state.notifications.map(n => `
        <div class="p-3 text-xs bg-slate-50 hover:bg-slate-100 flex gap-2.5">
          <div class="flex-1">
            <div class="flex justify-between font-bold text-slate-800">
              <span>${n.title}</span>
              <span class="text-[10px] text-slate-400 font-normal">${n.timestamp}</span>
            </div>
            <p class="text-slate-600 mt-0.5 leading-snug">${n.message}</p>
          </div>
        </div>
      `).join('');
    }

    function clearNotifications() {
      state.notifications = [];
      saveState();
      toggleNotifMenu();
    }

    function handleSearch(query) {
      if (!query.trim()) return;
      if (currentTab !== 'tasks') switchTab('tasks');
    }

    // Initialize application
    window.onload = function() {
      renderNav();
      renderCurrentTab();
    };
  </script>
</body>
</html>
